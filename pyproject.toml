[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causeway"
version = "0.1.0"
description = "Causal SOC alert correlation and root-cause intelligence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16.5",
    "mypy>=1.8",
]

[project.scripts]
causeway = "causeway.cli:main"

[tool.setuptools.packages.find]
include = ["causeway*", "ventriloquist*", "server*"]

[tool.setuptools.package-data]
causeway = ["policies/*.yaml"]
ventriloquist = ["policies/*.yaml"]
server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["deck"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Vendored engine keeps its `str, Enum` classes; StrEnum would change their repr.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
